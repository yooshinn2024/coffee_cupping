# A Little Coffee (珈琲の小時間 / 咖啡小记录)
# - Pull & run prebuilt CI/CD image:  docker compose pull && docker compose up -d
# - Local build & run:                docker compose up -d --build
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/yooshinn2024/coffee_cupping:latest}
    build: .
    container_name: coffee-cupping
    ports:
      - "${APP_PORT:-33003}:3000"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Tokyo}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-ineedacupofcoffee}
      - REQUIRE_LOGIN_FOR_HOME=${REQUIRE_LOGIN_FOR_HOME:-0}
    volumes:
      - ./data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: coffee-cupping-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: coffee-cupping-updater
    profiles: ["autodeploy"]
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-300}
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.44}
      - WATCHTOWER_HTTP_API_UPDATE=${WATCHTOWER_HTTP_API_UPDATE:-false}
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
